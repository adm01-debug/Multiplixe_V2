# 🐳 DOCKER COMPOSE - AMBIENTE COMPLETO
# Arquivo: docker-compose.yml
# Uso: docker-compose up -d

version: '3.8'

services:
  # ========================================
  # APP - APLICAÇÃO PRINCIPAL
  # ========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notifications-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - SENTRY_DSN=${SENTRY_DSN}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
      - postgres
    networks:
      - notifications-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # ========================================
  # REDIS - CACHE E QUEUE
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: notifications-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - notifications-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================
  # POSTGRES - DATABASE LOCAL (OPCIONAL)
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: notifications-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-notifications}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-notifications}
    ports:
      - "5432:5432"
    networks:
      - notifications-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notifications}"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ========================================
  # NGINX - REVERSE PROXY E LOAD BALANCER
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: notifications-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - notifications-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ========================================
  # PROMETHEUS - MÉTRICAS
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: notifications-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    networks:
      - notifications-network
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app

  # ========================================
  # GRAFANA - DASHBOARDS
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: notifications-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=http://localhost:3001
    ports:
      - "3001:3000"
    networks:
      - notifications-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus

  # ========================================
  # WORKER - PROCESSAMENTO DE FILA
  # ========================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notifications-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
    depends_on:
      - redis
      - postgres
    networks:
      - notifications-network
    volumes:
      - ./logs:/app/logs

# ========================================
# NETWORKS
# ========================================
networks:
  notifications-network:
    driver: bridge

# ========================================
# VOLUMES
# ========================================
volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
