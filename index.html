<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security Headers (meta-supported subset; HSTS/CSP/X-Frame-Options handled at edge) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), interest-cohort=()" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MULTIPLIXE" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    
    <!-- Preconnect: Supabase backend (faster first API/auth call) -->
    <link rel="preconnect" href="https://ywsblgsikhiscvpmopkp.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://ywsblgsikhiscvpmopkp.supabase.co">

    <!-- Fonts: self-hosted (Outfit + Space Grotesk) em /fonts, sem CSS externo bloqueando o render -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin.woff2" crossorigin>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/space-grotesk-latin.woff2" crossorigin>

    <!-- Preconnect: imagens de capa dos cursos -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    
    <title>MULTIPLIXE by Promo Brindes - Plataforma de Treinamento Corporativo</title>
    <meta name="description" content="Plataforma de treinamento corporativo via streaming. Desenvolva sua equipe com cursos de alta qualidade, trilhas personalizadas e certificações." />
    <meta name="author" content="Promo Brindes" />
    <meta name="keywords" content="treinamento corporativo, e-learning, cursos online, desenvolvimento profissional, capacitação empresarial" />

    <meta property="og:title" content="MULTIPLIXE by Promo Brindes - Plataforma de Treinamento Corporativo" />
    <meta property="og:description" content="Desenvolva sua equipe com cursos de alta qualidade, trilhas personalizadas e certificações." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://multiplixe-v2.vercel.app/icons/icon-512x512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@PromoBrindes" />
    <meta name="twitter:image" content="https://multiplixe-v2.vercel.app/icons/icon-512x512.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
